services:
  rustdesk-api:
    image: lejianwen/rustdesk-api
    container_name: rustdesk-api
    environment:
      - TZ=Asia/Shanghai
      - RUSTDESK_API_RUSTDESK_ID_SERVER=${RUSTDESK_ID_SERVER:?Set RUSTDESK_ID_SERVER in your local environment}
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=${RUSTDESK_RELAY_SERVER:?Set RUSTDESK_RELAY_SERVER in your local environment}
      - RUSTDESK_API_RUSTDESK_API_SERVER=${RUSTDESK_API_ORIGIN:?Set RUSTDESK_API_ORIGIN in your local environment}
      - RUSTDESK_API_RUSTDESK_KEY=${RUSTDESK_PUBLIC_KEY:?Set RUSTDESK_PUBLIC_KEY in your local environment}
    ports:
      - 21114:21114
    volumes:
      - ./data/rustdesk/api:/app/data # database
      # - ./conf:/app/conf # config
      # - ./resources:/app/resources # 静态资源
    restart: unless-stopped
